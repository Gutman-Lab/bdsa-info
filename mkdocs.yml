site_name: Brain Digital Slide Archive
site_url: https://info.bdsa.io/
site_description: >-
  The Brain Digital Slide Archive (BDSA) project: shared neuropathology
  imaging infrastructure, data, and documentation.
repo_url: https://github.com/Gutman-Lab/bdsa-info
repo_name: Gutman-Lab/bdsa-info
edit_uri: edit/main/docs/
copyright: BDSA contributors

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - content.action.edit
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Project overview: project.md
  - Digital Slide Archive docs: documentation.md
  - Public data: https://pub-data.bdsa.io
