name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Build project site and documentation mirror
        run: bash scripts/build.sh
      - name: Upload document root
        uses: actions/upload-artifact@v4
        with:
          name: info-bdsa-io
          path: publish
          retention-days: 14
