name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Build project site and documentation mirror
        run: bash scripts/build.sh
      - name: Upload document root
        uses: actions/upload-artifact@v4
        with:
          name: info-bdsa-io
          path: publish
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: info-bdsa-io
          path: publish
      - name: Package deploy artifact
        if: vars.INFO_DEPLOY_TRANSPORT != 'ssh'
        run: tar -C publish -czf publish.tar.gz .
      - name: Publish deploy artifact
        if: vars.INFO_DEPLOY_TRANSPORT != 'ssh'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view deploy-latest >/dev/null 2>&1 || \
            gh release create deploy-latest --title "info.bdsa.io deploy artifact" --notes "Rolling artifact pulled by candyproxy." --prerelease
          gh release upload deploy-latest publish.tar.gz --clobber
          gh release edit deploy-latest --notes "Deploy artifact from ${GITHUB_SHA} (run ${GITHUB_RUN_ID})."
      - name: Deploy to info.bdsa.io
        if: vars.INFO_DEPLOY_TRANSPORT == 'ssh'
        env:
          SSH_KEY: ${{ secrets.INFO_DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/info_deploy
          chmod 600 ~/.ssh/info_deploy
          printf '170.140.138.248 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExoOVNganYHI5C5bG25LKf/U+br+nDahAEefEYTTQLB\n' > ~/.ssh/known_hosts
          tar -C publish -czf - . | ssh -i ~/.ssh/info_deploy -o BatchMode=yes -o UserKnownHostsFile=~/.ssh/known_hosts bdsa-info-deploy@170.140.138.248
